openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: AgriChain Digital Agriculture Platform API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: farmers
    description: Farmer & Household Registry
  - name: groups
    description: Farmer groups and cooperatives
  - name: plots
    description: Farm plot mapping
  - name: certifications
    description: Certification streams and enrolments
  - name: surveys
    description: Field data collection and surveys
  - name: visits
    description: Agronomic visits
  - name: batches
    description: Commodity batches and bulking
  - name: procurement
    description: Commodity procurement and buying station
  - name: warehouse
    description: Warehouse and lot traceability
  - name: payments
    description: Farmer payments
  - name: compliance
    description: Certification compliance
  - name: exports
    description: Export documentation
  - name: users
    description: Staff and users
  - name: assets
    description: Asset management
  - name: activity-funds
    description: Activity fund management
  - name: dashboard
    description: Dashboard summaries and analytics
  - name: audit
    description: Audit log
  - name: admin
    description: System administration

paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  # ============================================================
  # DASHBOARD
  # ============================================================
  /dashboard/summary:
    get:
      operationId: getDashboardSummary
      tags: [dashboard]
      summary: Platform-wide summary stats
      responses:
        "200":
          description: Summary stats
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardSummary"

  /dashboard/activity:
    get:
      operationId: getDashboardActivity
      tags: [dashboard]
      summary: Recent platform activity feed
      parameters:
        - in: query
          name: limit
          schema:
            type: integer
            default: 20
      responses:
        "200":
          description: Activity feed
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ActivityItem"

  /dashboard/compliance-overview:
    get:
      operationId: getComplianceOverview
      tags: [dashboard]
      summary: Certification compliance overview by stream
      responses:
        "200":
          description: Compliance overview
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ComplianceOverview"

  /dashboard/procurement-stats:
    get:
      operationId: getProcurementStats
      tags: [dashboard]
      summary: Procurement volume and value stats
      responses:
        "200":
          description: Procurement stats
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProcurementStats"

  # ============================================================
  # FARMERS
  # ============================================================
  /farmers:
    get:
      operationId: listFarmers
      tags: [farmers]
      summary: List all farmers
      parameters:
        - in: query
          name: search
          schema:
            type: string
        - in: query
          name: groupId
          schema:
            type: string
        - in: query
          name: regionId
          schema:
            type: string
        - in: query
          name: certificationStream
          schema:
            type: string
        - in: query
          name: status
          schema:
            type: string
            enum: [active, inactive, pending]
        - in: query
          name: page
          schema:
            type: integer
            default: 1
        - in: query
          name: limit
          schema:
            type: integer
            default: 50
      responses:
        "200":
          description: Farmer list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaginatedFarmers"

    post:
      operationId: createFarmer
      tags: [farmers]
      summary: Register a new farmer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateFarmerBody"
      responses:
        "201":
          description: Farmer created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Farmer"

  /farmers/{farmerId}:
    get:
      operationId: getFarmer
      tags: [farmers]
      summary: Get farmer by ID
      parameters:
        - in: path
          name: farmerId
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Farmer details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FarmerDetail"
        "404":
          description: Not found

    patch:
      operationId: updateFarmer
      tags: [farmers]
      summary: Update farmer details
      parameters:
        - in: path
          name: farmerId
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateFarmerBody"
      responses:
        "200":
          description: Updated farmer
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Farmer"

  /farmers/{farmerId}/card:
    get:
      operationId: getFarmerCard
      tags: [farmers]
      summary: Get farmer digital card data (QR, certifications)
      parameters:
        - in: path
          name: farmerId
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Farmer card
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FarmerCard"

  /farmers/duplicates:
    get:
      operationId: listDuplicateFarmers
      tags: [farmers]
      summary: List flagged duplicate farmer pairs
      responses:
        "200":
          description: Duplicate pairs
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/DuplicatePair"

  /farmers/duplicates/{pairId}/merge:
    post:
      operationId: mergeDuplicateFarmers
      tags: [farmers]
      summary: Merge a duplicate farmer pair
      parameters:
        - in: path
          name: pairId
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MergeDuplicatesBody"
      responses:
        "200":
          description: Merge result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Farmer"

  # ============================================================
  # GROUPS
  # ============================================================
  /groups:
    get:
      operationId: listGroups
      tags: [groups]
      summary: List farmer groups
      parameters:
        - in: query
          name: regionId
          schema:
            type: string
      responses:
        "200":
          description: Group list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/FarmerGroup"

    post:
      operationId: createGroup
      tags: [groups]
      summary: Create a new farmer group
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateGroupBody"
      responses:
        "201":
          description: Group created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FarmerGroup"

  /groups/{groupId}:
    get:
      operationId: getGroup
      tags: [groups]
      summary: Get group details including membership
      parameters:
        - in: path
          name: groupId
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Group detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FarmerGroupDetail"

  # ============================================================
  # PLOTS
  # ============================================================
  /plots:
    get:
      operationId: listPlots
      tags: [plots]
      summary: List farm plots
      parameters:
        - in: query
          name: farmerId
          schema:
            type: string
      responses:
        "200":
          description: Plot list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Plot"

    post:
      operationId: createPlot
      tags: [plots]
      summary: Create a farm plot
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreatePlotBody"
      responses:
        "201":
          description: Plot created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Plot"

  /plots/{plotId}:
    get:
      operationId: getPlot
      tags: [plots]
      summary: Get plot by ID
      parameters:
        - in: path
          name: plotId
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Plot details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Plot"

  # ============================================================
  # CERTIFICATIONS
  # ============================================================
  /certifications/streams:
    get:
      operationId: listCertificationStreams
      tags: [certifications]
      summary: List available certification streams
      responses:
        "200":
          description: Certification streams
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CertificationStream"

  /certifications/enrolments:
    get:
      operationId: listEnrolments
      tags: [certifications]
      summary: List certification enrolments
      parameters:
        - in: query
          name: farmerId
          schema:
            type: string
        - in: query
          name: streamId
          schema:
            type: string
        - in: query
          name: status
          schema:
            type: string
            enum: [active, expired, pending]
      responses:
        "200":
          description: Enrolments
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CertificationEnrolment"

    post:
      operationId: createEnrolment
      tags: [certifications]
      summary: Enrol farmer in certification stream
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateEnrolmentBody"
      responses:
        "201":
          description: Enrolment created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CertificationEnrolment"

  # ============================================================
  # SURVEYS
  # ============================================================
  /surveys/templates:
    get:
      operationId: listSurveyTemplates
      tags: [surveys]
      summary: List survey templates
      responses:
        "200":
          description: Survey templates
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SurveyTemplate"

    post:
      operationId: createSurveyTemplate
      tags: [surveys]
      summary: Create a survey template
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateSurveyTemplateBody"
      responses:
        "201":
          description: Template created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SurveyTemplate"

  /surveys/submissions:
    get:
      operationId: listSurveySubmissions
      tags: [surveys]
      summary: List submitted surveys (QA dashboard)
      parameters:
        - in: query
          name: agentId
          schema:
            type: string
        - in: query
          name: groupId
          schema:
            type: string
        - in: query
          name: status
          schema:
            type: string
            enum: [pending, approved, rejected, flagged]
        - in: query
          name: dateFrom
          schema:
            type: string
            format: date
        - in: query
          name: dateTo
          schema:
            type: string
            format: date
      responses:
        "200":
          description: Survey submissions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SurveySubmission"

    post:
      operationId: submitSurvey
      tags: [surveys]
      summary: Submit a completed survey
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SubmitSurveyBody"
      responses:
        "201":
          description: Submission created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SurveySubmission"

  /surveys/submissions/{submissionId}/review:
    post:
      operationId: reviewSurveySubmission
      tags: [surveys]
      summary: Approve, reject or flag a survey submission
      parameters:
        - in: path
          name: submissionId
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReviewSubmissionBody"
      responses:
        "200":
          description: Updated submission
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SurveySubmission"

  # ============================================================
  # VISITS
  # ============================================================
  /visits:
    get:
      operationId: listVisits
      tags: [visits]
      summary: List agronomic visits
      parameters:
        - in: query
          name: agentId
          schema:
            type: string
        - in: query
          name: status
          schema:
            type: string
            enum: [scheduled, completed, overdue]
      responses:
        "200":
          description: Visits
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Visit"

    post:
      operationId: scheduleVisit
      tags: [visits]
      summary: Schedule an agronomic visit
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ScheduleVisitBody"
      responses:
        "201":
          description: Visit scheduled
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Visit"

  /visits/{visitId}/complete:
    post:
      operationId: completeVisit
      tags: [visits]
      summary: Mark a visit as completed
      parameters:
        - in: path
          name: visitId
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Visit completed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Visit"

  # ============================================================
  # BATCHES
  # ============================================================
  /batches:
    get:
      operationId: listBatches
      tags: [batches]
      summary: List commodity batches
      parameters:
        - in: query
          name: agentId
          schema:
            type: string
        - in: query
          name: status
          schema:
            type: string
            enum: [open, locked, delivered]
      responses:
        "200":
          description: Batches
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Batch"

    post:
      operationId: createBatch
      tags: [batches]
      summary: Create a new commodity batch
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateBatchBody"
      responses:
        "201":
          description: Batch created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Batch"

  /batches/{batchId}:
    get:
      operationId: getBatch
      tags: [batches]
      summary: Get batch details
      parameters:
        - in: path
          name: batchId
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Batch detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BatchDetail"

  /batches/{batchId}/lock:
    post:
      operationId: lockBatch
      tags: [batches]
      summary: Lock a batch after all weights confirmed
      parameters:
        - in: path
          name: batchId
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Batch locked
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Batch"

  # ============================================================
  # PROCUREMENT
  # ============================================================
  /procurement/deliveries:
    get:
      operationId: listDeliveries
      tags: [procurement]
      summary: List inbound deliveries
      parameters:
        - in: query
          name: status
          schema:
            type: string
            enum: [pending_weight, pending_qc, pending_pricing, pending_approval, approved, rejected]
        - in: query
          name: stationId
          schema:
            type: string
        - in: query
          name: dateFrom
          schema:
            type: string
            format: date
      responses:
        "200":
          description: Deliveries
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Delivery"

    post:
      operationId: createDelivery
      tags: [procurement]
      summary: Create inbound delivery from batch scan
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateDeliveryBody"
      responses:
        "201":
          description: Delivery created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Delivery"

  /procurement/deliveries/{deliveryId}:
    get:
      operationId: getDelivery
      tags: [procurement]
      summary: Get delivery by ID
      parameters:
        - in: path
          name: deliveryId
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Delivery detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeliveryDetail"

  /procurement/deliveries/{deliveryId}/weight:
    post:
      operationId: recordDeliveryWeight
      tags: [procurement]
      summary: Record gross/tare weight for delivery
      parameters:
        - in: path
          name: deliveryId
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RecordWeightBody"
      responses:
        "200":
          description: Weight recorded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Delivery"

  /procurement/deliveries/{deliveryId}/qc:
    post:
      operationId: recordDeliveryQC
      tags: [procurement]
      summary: Record quality control assessment
      parameters:
        - in: path
          name: deliveryId
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RecordQCBody"
      responses:
        "200":
          description: QC recorded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Delivery"

  /procurement/deliveries/{deliveryId}/pricing:
    post:
      operationId: submitDeliveryPricing
      tags: [procurement]
      summary: Submit pricing for delivery
      parameters:
        - in: path
          name: deliveryId
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SubmitPricingBody"
      responses:
        "200":
          description: Pricing submitted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Delivery"

  /procurement/deliveries/{deliveryId}/approve:
    post:
      operationId: approveDelivery
      tags: [procurement]
      summary: Approve or reject delivery pricing
      parameters:
        - in: path
          name: deliveryId
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ApprovalBody"
      responses:
        "200":
          description: Approval decision recorded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Delivery"

  # ============================================================
  # WAREHOUSE
  # ============================================================
  /warehouse/lots:
    get:
      operationId: listLots
      tags: [warehouse]
      summary: List warehouse lots
      parameters:
        - in: query
          name: status
          schema:
            type: string
            enum: [received, in_processing, processed, allocated, exported]
        - in: query
          name: certificationStream
          schema:
            type: string
      responses:
        "200":
          description: Lots
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Lot"

  /warehouse/lots/{lotId}:
    get:
      operationId: getLot
      tags: [warehouse]
      summary: Get lot details and chain of custody
      parameters:
        - in: path
          name: lotId
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Lot detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LotDetail"

  /warehouse/mass-balance:
    get:
      operationId: getWarehouseMassBalance
      tags: [warehouse]
      summary: Mass balance report
      responses:
        "200":
          description: Mass balance
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MassBalance"

  # ============================================================
  # PAYMENTS
  # ============================================================
  /payments:
    get:
      operationId: listPayments
      tags: [payments]
      summary: List farmer payments
      parameters:
        - in: query
          name: farmerId
          schema:
            type: string
        - in: query
          name: status
          schema:
            type: string
            enum: [pending, processing, paid, failed]
        - in: query
          name: dateFrom
          schema:
            type: string
            format: date
      responses:
        "200":
          description: Payments
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Payment"

    post:
      operationId: initiatePayment
      tags: [payments]
      summary: Initiate a farmer payment
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InitiatePaymentBody"
      responses:
        "201":
          description: Payment initiated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Payment"

  /payments/summary:
    get:
      operationId: getPaymentSummary
      tags: [payments]
      summary: Payment summary stats and pending totals
      responses:
        "200":
          description: Payment summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaymentSummary"

  # ============================================================
  # COMPLIANCE
  # ============================================================
  /compliance/eudr:
    get:
      operationId: getEudrCompliance
      tags: [compliance]
      summary: EUDR compliance status overview
      responses:
        "200":
          description: EUDR compliance
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EudrCompliance"

  /compliance/gap-assessments:
    get:
      operationId: listGapAssessments
      tags: [compliance]
      summary: List GAP assessments
      parameters:
        - in: query
          name: farmerId
          schema:
            type: string
        - in: query
          name: groupId
          schema:
            type: string
      responses:
        "200":
          description: GAP assessments
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/GapAssessment"

    post:
      operationId: submitGapAssessment
      tags: [compliance]
      summary: Submit a GAP assessment
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SubmitGapAssessmentBody"
      responses:
        "201":
          description: GAP assessment submitted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GapAssessment"

  /compliance/training-sessions:
    get:
      operationId: listTrainingSessions
      tags: [compliance]
      summary: List training sessions
      responses:
        "200":
          description: Training sessions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TrainingSession"

    post:
      operationId: createTrainingSession
      tags: [compliance]
      summary: Create a training session
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateTrainingSessionBody"
      responses:
        "201":
          description: Training session created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TrainingSession"

  # ============================================================
  # EXPORTS
  # ============================================================
  /exports/contracts:
    get:
      operationId: listExportContracts
      tags: [exports]
      summary: List export contracts
      responses:
        "200":
          description: Export contracts
          content:
