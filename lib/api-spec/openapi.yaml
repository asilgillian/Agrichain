        weightApprovedById: { type: string }
        weightApprovedByName: { type: string }
        weightApprovedAt: { type: string, format: date-time }
        weightApproved: { type: boolean }
        moistureContent: { type: number }
        defectCount: { type: number }
        cupScore: { type: number }
        grade: { type: string }
        qcSubmittedById: { type: string }
        qcSubmittedByName: { type: string }
        qcSubmittedAt: { type: string, format: date-time }
        qcApprovedById: { type: string }
        qcApprovedByName: { type: string }
        qcApprovedAt: { type: string, format: date-time }
