        commodityType: { type: string }
        seasonStart: { type: string, format: date }
        seasonEnd: { type: string, format: date }
        floorPricePerKg: { type: number }
        currency: { type: string }
        notes: { type: string }
        status:
          type: string
          enum: [DRAFT, ACTIVE]
      required: [contractType, groupId, commodityType]

