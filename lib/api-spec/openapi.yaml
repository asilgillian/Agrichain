      responses:
        "200":
          description: Sync queue
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SyncQueueStatus"

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required: [status]

    # ============================================================
    # DASHBOARD
    # ============================================================
    DashboardSummary:
      type: object
      properties:
        totalFarmers:
          type: integer
        activePlots:
          type: integer
        totalGroups:
          type: integer
        totalAreaHectares:
          type: number
        pendingDeliveries:
          type: integer
        totalProcuredKg:
          type: number
        totalPaymentsPending:
          type: number
        complianceRate:
          type: number
        syncPendingCount:
          type: integer
      required: [totalFarmers, activePlots, totalGroups, totalAreaHectares, pendingDeliveries, totalProcuredKg, totalPaymentsPending, complianceRate, syncPendingCount]

    ActivityItem:
      type: object
      properties:
        id:
          type: string
        type:
          type: string
          enum: [farmer_registered, batch_created, delivery_approved, payment_processed, compliance_flag, certification_enrolled]
        description:
          type: string
        actorName:
          type: string
        entityId:
          type: string
        entityType:
          type: string
        timestamp:
          type: string
          format: date-time
      required: [id, type, description, actorName, entityId, entityType, timestamp]

    ComplianceOverview:
      type: object
      properties:
        streams:
          type: array
          items:
            type: object
            properties:
              streamName:
                type: string
              enrolledFarmers:
                type: integer
              compliantFarmers:
                type: integer
              expiringIn30Days:
                type: integer
              complianceRate:
                type: number
            required: [streamName, enrolledFarmers, compliantFarmers, expiringIn30Days, complianceRate]
      required: [streams]

    ProcurementStats:
      type: object
      properties:
        weeklyVolumeKg:
          type: number
        monthlyVolumeKg:
          type: number
        pendingApprovals:
          type: integer
        rejectedDeliveries:
          type: integer
        averageGradeScore:
          type: number
        totalValueThisMonth:
          type: number
      required: [weeklyVolumeKg, monthlyVolumeKg, pendingApprovals, rejectedDeliveries, averageGradeScore, totalValueThisMonth]

    # ============================================================
    # FARMER
    # ============================================================
    Farmer:
      type: object
      properties:
        id:
          type: string
        referenceNumber:
          type: string
        firstName:
          type: string
        lastName:
          type: string
        nationalId:
          type: string
        dateOfBirth:
          type: string
          format: date
        phoneNumber:
          type: string
        sex:
          type: string
          enum: [male, female, other]
        groupId:
          type: string
        groupName:
          type: string
        regionId:
          type: string
        village:
          type: string
        status:
          type: string
          enum: [active, inactive, pending]
        photoUrl:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required: [id, referenceNumber, firstName, lastName, groupId, regionId, status, createdAt, updatedAt]

    FarmerDetail:
      allOf:
        - $ref: "#/components/schemas/Farmer"
        - type: object
          properties:
            plots:
              type: array
              items:
                $ref: "#/components/schemas/Plot"
            certifications:
              type: array
              items:
                $ref: "#/components/schemas/CertificationEnrolment"
            recentSurveys:
              type: array
              items:
                $ref: "#/components/schemas/SurveySubmission"
            gapScore:
              type: number
          required: [plots, certifications, recentSurveys]

    FarmerCard:
      type: object
      properties:
        farmerId:
          type: string
        referenceNumber:
          type: string
        fullName:
          type: string
        photoUrl:
          type: string
        groupName:
          type: string
        village:
          type: string
        qrCodeData:
          type: string
        certifications:
          type: array
          items:
            type: object
            properties:
              streamName:
                type: string
              status:
                type: string
              expiryDate:
                type: string
                format: date
            required: [streamName, status]
      required: [farmerId, referenceNumber, fullName, groupName, qrCodeData, certifications]

    PaginatedFarmers:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/Farmer"
        total:
          type: integer
        page:
          type: integer
        limit:
          type: integer
      required: [data, total, page, limit]

    CreateFarmerBody:
      type: object
      properties:
        firstName:
          type: string
        lastName:
          type: string
        nationalId:
          type: string
        dateOfBirth:
          type: string
          format: date
        phoneNumber:
          type: string
        sex:
          type: string
          enum: [male, female, other]
        groupId:
          type: string
        regionId:
          type: string
        village:
          type: string
        photoUrl:
          type: string
      required: [firstName, lastName, nationalId, groupId, regionId]

    UpdateFarmerBody:
      type: object
      properties:
        firstName:
          type: string
        lastName:
          type: string
        phoneNumber:
          type: string
        groupId:
          type: string
        status:
          type: string
          enum: [active, inactive]

    DuplicatePair:
      type: object
      properties:
        id:
          type: string
        farmer1:
          $ref: "#/components/schemas/Farmer"
        farmer2:
          $ref: "#/components/schemas/Farmer"
        matchScore:
          type: number
        matchReasons:
          type: array
          items:
            type: string
        status:
          type: string
          enum: [pending, merged, dismissed]
      required: [id, farmer1, farmer2, matchScore, matchReasons, status]

    MergeDuplicatesBody:
      type: object
      properties:
        masterFarmerId:
          type: string
      required: [masterFarmerId]

    # ============================================================
    # GROUPS
    # ============================================================
    FarmerGroup:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        regionId:
          type: string
        village:
          type: string
        memberCount:
          type: integer
        complianceScore:
          type: number
        activePlots:
          type: integer
        createdAt:
          type: string
          format: date-time
      required: [id, name, regionId, memberCount, createdAt]

    FarmerGroupDetail:
      allOf:
        - $ref: "#/components/schemas/FarmerGroup"
        - type: object
          properties:
            members:
              type: array
              items:
                $ref: "#/components/schemas/Farmer"
            leaders:
              type: array
              items:
                type: object
                properties:
                  farmerId:
                    type: string
                  name:
                    type: string
                  role:
                    type: string
                  startDate:
                    type: string
                    format: date
                required: [farmerId, name, role, startDate]
          required: [members, leaders]

    CreateGroupBody:
      type: object
      properties:
        name:
          type: string
        regionId:
          type: string
        village:
          type: string
      required: [name, regionId]

    # ============================================================
    # PLOTS
    # ============================================================
    Plot:
      type: object
      properties:
        id:
          type: string
        farmerId:
          type: string
        name:
          type: string
        cropType:
          type: string
        areaHectares:
          type: number
        polygon:
          type: object
          description: GeoJSON polygon
        harvestDate:
          type: string
          format: date
        status:
          type: string
          enum: [active, inactive]
        createdAt:
          type: string
          format: date-time
      required: [id, farmerId, cropType, areaHectares, status, createdAt]

    CreatePlotBody:
      type: object
      properties:
        farmerId:
          type: string
        name:
          type: string
        cropType:
          type: string
        polygon:
          type: object
        harvestDate:
          type: string
          format: date
      required: [farmerId, cropType]

    # ============================================================
    # CERTIFICATIONS
    # ============================================================
    CertificationStream:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
          enum: [EUDR, RainforestAlliance, FairTrade, Organic, Custom]
        description:
          type: string
        requiresGpsPolygon:
          type: boolean
        eligibilityCriteria:
          type: array
          items:
            type: string
        active:
          type: boolean
      required: [id, name, requiresGpsPolygon, active]

    CertificationEnrolment:
      type: object
      properties:
        id:
          type: string
        farmerId:
          type: string
        streamId:
          type: string
        streamName:
          type: string
        enrolmentDate:
          type: string
          format: date
        expiryDate:
          type: string
          format: date
        status:
          type: string
          enum: [active, expired, suspended, pending]
      required: [id, farmerId, streamId, streamName, enrolmentDate, status]

    CreateEnrolmentBody:
      type: object
      properties:
        farmerId:
          type: string
        streamId:
          type: string
        enrolmentDate:
          type: string
          format: date
        expiryDate:
          type: string
          format: date
      required: [farmerId, streamId, enrolmentDate]

    # ============================================================
    # SURVEYS
    # ============================================================
    SurveyTemplate:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        type:
          type: string
          enum: [farm_visit, gap_assessment, training_attendance, commodity_inspection, custom]
        fields:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
              label:
                type: string
              type:
                type: string
                enum: [text, number, date, dropdown, photo, gps, boolean]
              required:
                type: boolean
              options:
                type: array
                items:
                  type: string
            required: [id, label, type, required]
        published:
          type: boolean
        createdAt:
          type: string
          format: date-time
      required: [id, name, type, fields, published, createdAt]

    CreateSurveyTemplateBody:
      type: object
      properties:
        name:
          type: string
        type:
          type: string
          enum: [farm_visit, gap_assessment, training_attendance, commodity_inspection, custom]
        fields:
          type: array
          items:
            type: object
            properties:
              label:
                type: string
              type:
                type: string
              required:
                type: boolean
              options:
                type: array
                items:
                  type: string
            required: [label, type, required]
      required: [name, type, fields]

    SurveySubmission:
      type: object
      properties:
        id:
          type: string
        templateId:
          type: string
        templateName:
          type: string
        farmerId:
          type: string
        farmerName:
          type: string
        agentId:
          type: string
        agentName:
          type: string
        responses:
          type: object
          additionalProperties: true
        gpsLat:
          type: number
        gpsLng:
          type: number
        status:
          type: string
          enum: [pending, approved, rejected, flagged]
        reviewComment:
          type: string
        submittedAt:
          type: string
          format: date-time
        reviewedAt:
          type: string
          format: date-time
      required: [id, templateId, farmerId, agentId, status, submittedAt]

    SubmitSurveyBody:
      type: object
      properties:
        templateId:
          type: string
        farmerId:
          type: string
        responses:
          type: object
          additionalProperties: true
        gpsLat:
          type: number
        gpsLng:
          type: number
      required: [templateId, farmerId, responses]

    ReviewSubmissionBody:
      type: object
      properties:
        decision:
          type: string
          enum: [approved, rejected, flagged]
        comment:
          type: string
      required: [decision, comment]

    # ============================================================
    # VISITS
    # ============================================================
    Visit:
      type: object
      properties:
        id:
          type: string
        farmerId:
          type: string
        farmerName:
          type: string
        agentId:
          type: string
        agentName:
          type: string
        scheduledDate:
          type: string
          format: date
        completedAt:
          type: string
          format: date-time
        priority:
          type: string
          enum: [low, medium, high, critical]
        status:
          type: string
          enum: [scheduled, completed, overdue, cancelled]
        notes:
          type: string
      required: [id, farmerId, agentId, scheduledDate, priority, status]

    ScheduleVisitBody:
      type: object
      properties:
        farmerId:
          type: string
        agentId:
          type: string
        scheduledDate:
          type: string
          format: date
        priority:
          type: string
          enum: [low, medium, high, critical]
        notes:
          type: string
      required: [farmerId, agentId, scheduledDate, priority]

    # ============================================================
    # BATCHES
    # ============================================================
    Batch:
      type: object
      properties:
        id:
          type: string
        batchTag:
          type: string
        agentId:
          type: string
        agentName:
          type: string
        cropType:
          type: string
        totalWeightKg:
          type: number
        farmerCount:
          type: integer
        qualifyingStreams:
          type: array
          items:
            type: string
        status:
          type: string
          enum: [open, locked, delivered, received_at_station]
        harvestDate:
          type: string
          format: date
        createdAt:
          type: string
          format: date-time
      required: [id, batchTag, agentId, cropType, totalWeightKg, farmerCount, qualifyingStreams, status, createdAt]

    BatchDetail:
      allOf:
        - $ref: "#/components/schemas/Batch"
        - type: object
          properties:
            farmerContributions:
              type: array
              items:
                type: object
                properties:
                  farmerId:
                    type: string
                  farmerName:
                    type: string
                  grossWeightKg:
                    type: number
                  harvestDate:
                    type: string
                    format: date
                  activeStreams:
                    type: array
                    items:
                      type: string
                required: [farmerId, farmerName, grossWeightKg, harvestDate, activeStreams]
          required: [farmerContributions]

    CreateBatchBody:
