  # ============================================================
  /admin/regions:
    get:
      operationId: listRegions
      tags: [admin]
      summary: List administrative regions
      description: |
        Returns a flat list of admin regions, optionally filtered. Used by the
        cascading region picker to fetch one level at a time so it never has to
        pull the entire (100k-row) regions table for countries like Uganda.
      parameters:
        - in: query
          name: country
          schema: { type: string }
          description: ISO country code (e.g. UG, KE)
        - in: query
          name: level
          schema: { type: integer, minimum: 1 }
          description: Admin level (1=top, e.g. district)
        - in: query
          name: parentId
          schema: { type: string }
          description: |
            Parent region id, or the literal string "null" to return root-level
            rows (those with no parent).
        - in: query
          name: ids
          schema: { type: string }
          description: |
            Comma-separated list of region ids to fetch in one shot (max 500).
            Used to resolve names for already-known ids without scanning the
            full table.
      responses:
        "200":
          description: Regions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Region"

    post:
      operationId: createRegion
      tags: [admin]
      summary: Create an administrative region
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateRegionBody"
