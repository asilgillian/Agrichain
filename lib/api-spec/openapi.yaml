            type: object
            properties:
              type: { type: string }
              percentage: { type: number }
              reason: { type: string }
        pricingIncentives:
          type: array
          items:
            type: object
            properties:
              type: { type: string }
              percentage: { type: number }
              reason: { type: string }
        qualifyingStreams:
          type: array
          items: { type: string }
        status:
          type: string
          enum: [pending_weight_submit, pending_weight_approve, pending_qc_submit, pending_qc_approve, pending_pricing_propose, pending_pricing_approve, approved, rejected_correction, rejected_commodity, rejected_escalate, partial_rejection, suspended]
        rejectionType:
          type: string
          enum: [CORRECTION, COMMODITY, ESCALATE, PARTIAL, SUSPEND]
