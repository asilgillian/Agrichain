components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required: [status]

    # ============================================================
    # DASHBOARD
    # ============================================================
    DashboardSummary:
      type: object
      properties:
        totalFarmers:
          type: integer
        activePlots:
          type: integer
        totalGroups:
          type: integer
        totalAreaHectares:
          type: number
        pendingDeliveries:
          type: integer
        totalProcuredKg:
          type: number
        totalPaymentsPending:
          type: number
        complianceRate:
          type: number
        syncPendingCount:
          type: integer
      required: [totalFarmers, activePlots, totalGroups, totalAreaHectares, pendingDeliveries, totalProcuredKg, totalPaymentsPending, complianceRate, syncPendingCount]

    ActivityItem:
      type: object
      properties:
        id:
