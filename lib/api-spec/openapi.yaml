          type: string
          enum: [weight, qc, pricing, final]
        rejectionReason: { type: string }
        rejectionByName: { type: string }
        rejectionAt: { type: string, format: date-time }
        preOffloadSampleTaken: { type: boolean }
        createdAt: { type: string, format: date-time }
      required: [id, lotTag, batchId, status, createdAt]

