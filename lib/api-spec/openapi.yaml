openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: AgriChain Digital Agriculture Platform API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: farmers
    description: Farmer & Household Registry
  - name: groups
    description: Farmer groups and cooperatives
  - name: plots
    description: Farm plot mapping
  - name: certifications
    description: Certification streams and enrolments
  - name: surveys
    description: Field data collection and surveys
  - name: visits
    description: Agronomic visits
  - name: batches
    description: Commodity batches and bulking
  - name: procurement
    description: Commodity procurement and buying station
  - name: warehouse
    description: Warehouse and lot traceability
  - name: payments
    description: Farmer payments
  - name: compliance
    description: Certification compliance
  - name: exports
    description: Export documentation
  - name: users
    description: Staff and users
  - name: assets
    description: Asset management
  - name: activity-funds
    description: Activity fund management
  - name: dashboard
    description: Dashboard summaries and analytics
  - name: audit
    description: Audit log
  - name: admin
    description: System administration

paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  # ============================================================
  # DASHBOARD
  # ============================================================
  /dashboard/summary:
    get:
      operationId: getDashboardSummary
      tags: [dashboard]
      summary: Platform-wide summary stats
      responses:
        "200":
          description: Summary stats
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardSummary"

  /dashboard/activity:
    get:
      operationId: getDashboardActivity
      tags: [dashboard]
      summary: Recent platform activity feed
      parameters:
        - in: query
          name: limit
          schema:
            type: integer
            default: 20
      responses:
        "200":
          description: Activity feed
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ActivityItem"

  /dashboard/compliance-overview:
    get:
      operationId: getComplianceOverview
      tags: [dashboard]
      summary: Certification compliance overview by stream
      responses:
        "200":
          description: Compliance overview
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ComplianceOverview"

  /dashboard/procurement-stats:
    get:
      operationId: getProcurementStats
      tags: [dashboard]
      summary: Procurement volume and value stats
      responses:
        "200":
          description: Procurement stats
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProcurementStats"

  # ============================================================
  # FARMERS
  # ============================================================
  /farmers:
    get:
      operationId: listFarmers
      tags: [farmers]
      summary: List all farmers
      parameters:
        - in: query
          name: search
          schema:
            type: string
        - in: query
          name: groupId
          schema:
            type: string
        - in: query
          name: regionId
          schema:
            type: string
        - in: query
          name: certificationStream
          schema:
            type: string
        - in: query
          name: status
          schema:
            type: string
            enum: [active, inactive, pending]
        - in: query
          name: page
          schema:
            type: integer
            default: 1
        - in: query
          name: limit
          schema:
            type: integer
            default: 50
      responses:
        "200":
          description: Farmer list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaginatedFarmers"

    post:
      operationId: createFarmer
      tags: [farmers]
      summary: Register a new farmer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateFarmerBody"
      responses:
        "201":
          description: Farmer created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Farmer"

  /farmers/{farmerId}:
    get:
      operationId: getFarmer
      tags: [farmers]
      summary: Get farmer by ID
      parameters:
        - in: path
          name: farmerId
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Farmer details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FarmerDetail"
        "404":
          description: Not found

    patch:
      operationId: updateFarmer
      tags: [farmers]
      summary: Update farmer details
      parameters:
        - in: path
          name: farmerId
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateFarmerBody"
      responses:
        "200":
          description: Updated farmer
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Farmer"

  /farmers/{farmerId}/card:
    get:
      operationId: getFarmerCard
      tags: [farmers]
      summary: Get farmer digital card data (QR, certifications)
      parameters:
        - in: path
          name: farmerId
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Farmer card
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FarmerCard"

  /farmers/duplicates:
    get:
      operationId: listDuplicateFarmers
      tags: [farmers]
      summary: List flagged duplicate farmer pairs
      responses:
        "200":
          description: Duplicate pairs
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/DuplicatePair"

  /farmers/duplicates/{pairId}/merge:
    post:
      operationId: mergeDuplicateFarmers
      tags: [farmers]
      summary: Merge a duplicate farmer pair
      parameters:
        - in: path
          name: pairId
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MergeDuplicatesBody"
      responses:
        "200":
          description: Merge result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Farmer"

  # ============================================================
  # GROUPS
  # ============================================================
  /groups:
    get:
      operationId: listGroups
      tags: [groups]
      summary: List farmer groups
      parameters:
        - in: query
          name: regionId
          schema:
            type: string
      responses:
        "200":
          description: Group list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/FarmerGroup"

    post:
      operationId: createGroup
      tags: [groups]
      summary: Create a new farmer group
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateGroupBody"
      responses:
        "201":
          description: Group created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FarmerGroup"

  /groups/{groupId}:
    get:
      operationId: getGroup
      tags: [groups]
      summary: Get group details including membership
      parameters:
        - in: path
          name: groupId
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Group detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FarmerGroupDetail"

  # ============================================================
  # PLOTS
  # ============================================================
  /plots:
    get:
      operationId: listPlots
      tags: [plots]
      summary: List farm plots
      parameters:
        - in: query
          name: farmerId
          schema:
            type: string
      responses:
        "200":
          description: Plot list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Plot"

    post:
      operationId: createPlot
      tags: [plots]
      summary: Create a farm plot
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreatePlotBody"
      responses:
        "201":
          description: Plot created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Plot"

  /plots/{plotId}:
    get:
      operationId: getPlot
      tags: [plots]
      summary: Get plot by ID
      parameters:
        - in: path
          name: plotId
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Plot details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Plot"

  # ============================================================
  # CERTIFICATIONS
  # ============================================================
  /certifications/streams:
    get:
      operationId: listCertificationStreams
      tags: [certifications]
      summary: List available certification streams
      responses:
        "200":
          description: Certification streams
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CertificationStream"

  /certifications/enrolments:
    get:
      operationId: listEnrolments
      tags: [certifications]
      summary: List certification enrolments
      parameters:
        - in: query
          name: farmerId
          schema:
            type: string
        - in: query
          name: streamId
          schema:
            type: string
        - in: query
          name: status
          schema:
            type: string
            enum: [active, expired, pending]
      responses:
        "200":
          description: Enrolments
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CertificationEnrolment"

    post:
      operationId: createEnrolment
      tags: [certifications]
      summary: Enrol farmer in certification stream
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateEnrolmentBody"
      responses:
        "201":
          description: Enrolment created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CertificationEnrolment"

  # ============================================================
  # SURVEYS
  # ============================================================
  /surveys/templates:
    get:
      operationId: listSurveyTemplates
      tags: [surveys]
      summary: List survey templates
      responses:
        "200":
          description: Survey templates
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SurveyTemplate"

    post:
      operationId: createSurveyTemplate
      tags: [surveys]
      summary: Create a survey template
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateSurveyTemplateBody"
      responses:
        "201":
          description: Template created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SurveyTemplate"

  /surveys/submissions:
    get:
      operationId: listSurveySubmissions
      tags: [surveys]
      summary: List submitted surveys (QA dashboard)
      parameters:
        - in: query
          name: agentId
          schema:
            type: string
        - in: query
          name: groupId
          schema:
            type: string
        - in: query
          name: status
          schema:
            type: string
            enum: [pending, approved, rejected, flagged]
        - in: query
          name: dateFrom
          schema:
            type: string
            format: date
        - in: query
          name: dateTo
          schema:
            type: string
            format: date
      responses:
        "200":
          description: Survey submissions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SurveySubmission"

    post:
      operationId: submitSurvey
      tags: [surveys]
      summary: Submit a completed survey
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SubmitSurveyBody"
      responses:
        "201":
          description: Submission created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SurveySubmission"

  /surveys/submissions/{submissionId}/review:
    post:
      operationId: reviewSurveySubmission
      tags: [surveys]
      summary: Approve, reject or flag a survey submission
      parameters:
        - in: path
          name: submissionId
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReviewSubmissionBody"
      responses:
        "200":
          description: Updated submission
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SurveySubmission"

  # ============================================================
  # VISITS
  # ============================================================
  /visits:
    get:
      operationId: listVisits
      tags: [visits]
      summary: List agronomic visits
      parameters:
        - in: query
          name: agentId
          schema:
            type: string
        - in: query
          name: status
          schema:
            type: string
            enum: [scheduled, completed, overdue]
      responses:
        "200":
          description: Visits
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Visit"

    post:
      operationId: scheduleVisit
      tags: [visits]
      summary: Schedule an agronomic visit
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ScheduleVisitBody"
      responses:
        "201":
          description: Visit scheduled
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Visit"

  /visits/{visitId}/complete:
    post:
      operationId: completeVisit
      tags: [visits]
      summary: Mark a visit as completed
      parameters:
        - in: path
          name: visitId
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Visit completed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Visit"

  # ============================================================
  # BATCHES
  # ============================================================
  /batches:
    get:
      operationId: listBatches
      tags: [batches]
      summary: List commodity batches
      parameters:
        - in: query
          name: agentId
          schema:
            type: string
        - in: query
          name: status
          schema:
            type: string
            enum: [open, locked, delivered]
      responses:
        "200":
          description: Batches
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Batch"

    post:
      operationId: createBatch
      tags: [batches]
      summary: Create a new commodity batch
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateBatchBody"
      responses:
        "201":
          description: Batch created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Batch"

  /batches/{batchId}:
    get:
      operationId: getBatch
      tags: [batches]
      summary: Get batch details
      parameters:
        - in: path
          name: batchId
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Batch detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BatchDetail"

  /batches/{batchId}/lock:
    post:
      operationId: lockBatch
      tags: [batches]
      summary: Lock a batch after all weights confirmed
      parameters:
        - in: path
          name: batchId
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Batch locked
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Batch"

  # ============================================================
  # PROCUREMENT
  # ============================================================
  /procurement/deliveries:
    get:
      operationId: listDeliveries
      tags: [procurement]
      summary: List inbound deliveries
      parameters:
        - in: query
          name: status
          schema:
            type: string
            enum: [pending_weight_submit, pending_weight_approve, pending_qc_submit, pending_qc_approve, pending_pricing_propose, pending_pricing_approve, approved, rejected_correction, rejected_commodity, rejected_escalate, partial_rejection, suspended]
        - in: query
          name: stationId
          schema:
            type: string
        - in: query
          name: dateFrom
          schema:
            type: string
            format: date
      responses:
        "200":
          description: Deliveries
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Delivery"

    post:
      operationId: createDelivery
      tags: [procurement]
      summary: Create inbound delivery from batch scan
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateDeliveryBody"
      responses:
        "201":
          description: Delivery created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Delivery"

  /procurement/deliveries/{deliveryId}:
    get:
      operationId: getDelivery
      tags: [procurement]
      summary: Get delivery by ID
      parameters:
        - in: path
          name: deliveryId
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Delivery detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeliveryDetail"

  /procurement/deliveries/{deliveryId}/weight/submit:
    post:
      operationId: submitDeliveryWeight
      tags: [procurement]
      summary: Submit gross/tare weight (submitter step)
      parameters:
        - in: path
          name: deliveryId
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SubmitWeightBody"
      responses:
        "200":
          description: Weight submitted, awaiting approval
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Delivery" }

  /procurement/deliveries/{deliveryId}/weight/approve:
    post:
      operationId: approveDeliveryWeight
      tags: [procurement]
      summary: Approve submitted weight (approver must differ from submitter)
      parameters:
        - in: path
          name: deliveryId
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Weight approved
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Delivery" }

  /procurement/deliveries/{deliveryId}/qc/submit:
    post:
      operationId: submitDeliveryQc
      tags: [procurement]
      summary: Submit QC assessment (submitter step)
      parameters:
        - in: path
          name: deliveryId
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SubmitQcBody"
      responses:
        "200":
          description: QC submitted, awaiting approval
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Delivery" }

  /procurement/deliveries/{deliveryId}/qc/approve:
    post:
      operationId: approveDeliveryQc
      tags: [procurement]
      summary: Approve QC assessment (approver must differ from submitter)
      parameters:
        - in: path
          name: deliveryId
          required: true
          schema: { type: string }
      responses:
        "200":
          description: QC approved, trade desk unlocked
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Delivery" }

  /procurement/deliveries/{deliveryId}/pricing/propose:
    post:
      operationId: proposeDeliveryPricing
      tags: [procurement]
      summary: Trade desk proposes pricing (locked behind both approvals)
      parameters:
        - in: path
          name: deliveryId
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProposePricingBody"
      responses:
        "200":
          description: Pricing proposed
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Delivery" }

  /procurement/deliveries/{deliveryId}/pricing/approve:
    post:
      operationId: approveDeliveryPricing
      tags: [procurement]
      summary: Procurement head approves pricing (different person than proposer)
      parameters:
        - in: path
          name: deliveryId
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Pricing approved, ready for finance
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Delivery" }

  /procurement/deliveries/{deliveryId}/reject:
    post:
      operationId: rejectDelivery
      tags: [procurement]
      summary: Reject the delivery at any stage with one of 5 rejection types
      parameters:
        - in: path
          name: deliveryId
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RejectDeliveryBody"
      responses:
        "200":
          description: Rejection recorded
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Delivery" }

  /procurement/deliveries/{deliveryId}/resume:
    post:
      operationId: resumeDelivery
      tags: [procurement]
      summary: Resume a delivery rejected as PARTIAL or ESCALATE; routes back to the matching submit step
      parameters:
        - in: path
          name: deliveryId
          required: true
          schema: { type: string }
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                note: { type: string, description: "Optional manager note explaining the resume" }
      responses:
        "200":
          description: Delivery resumed; status returned to the matching submit step
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Delivery" }

  /procurement/contracts:
    get:
      operationId: listProcurementContracts
      tags: [procurement]
      summary: List pre-season / per-delivery procurement contracts
      parameters:
        - in: query
          name: groupId
          schema: { type: string }
        - in: query
          name: status
          schema:
            type: string
            enum: [DRAFT, ACTIVE, EXPIRED, SUSPENDED]
      responses:
        "200":
          description: Contracts
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/ProcurementContract" }
    post:
      operationId: createProcurementContract
      tags: [procurement]
      summary: Create a procurement contract
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateProcurementContractBody"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProcurementContract" }

  /procurement/contracts/{contractId}:
    patch:
      operationId: updateProcurementContract
      tags: [procurement]
      summary: Update a procurement contract (e.g. activate or suspend)
      parameters:
        - in: path
          name: contractId
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateProcurementContractBody"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProcurementContract" }

  # ---- Procurement workflow master ----
  /procurement/workflows:
    get:
      operationId: listProcurementWorkflows
      tags: [procurement]
      summary: List procurement workflows (master)
      responses:
        "200":
          description: Workflows
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/ProcurementWorkflow" }
    post:
      operationId: createProcurementWorkflow
      tags: [procurement]
      summary: Create a new procurement workflow
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateProcurementWorkflowBody" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProcurementWorkflowDetail" }

  /procurement/workflows/{workflowId}:
    get:
      operationId: getProcurementWorkflow
      tags: [procurement]
      summary: Get a workflow with its stages
      parameters:
        - in: path
          name: workflowId
