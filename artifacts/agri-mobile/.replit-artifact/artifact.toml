kind = "mobile"
previewPath = "/agri-mobile/"
title = "AgriChain Field"
version = "1.0.0"
id = "artifacts/agri-mobile"
router = "expo-domain"

[[integratedSkills]]
name = "expo"
version = "1.0.0"

[[services]]
ensurePreviewReachable = "/status"
name = "expo"
paths = [ "/agri-mobile/" ]
localPort = 20305

[services.development]
run = "pnpm --filter @workspace/agri-mobile run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/agri-mobile", "run", "build" ]
run = [ "pnpm", "--filter", "@workspace/agri-mobile", "run", "serve" ]

[services.env]
PORT = "20305"
BASE_PATH = "/agri-mobile/"
